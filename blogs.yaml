# blog2epub configuration.
#
# `blogs`  are sources: each is monitored and cached on its own.
# `books`  are outputs: an EPUB built from one or more blogs. Every blog also
#          builds its own standalone book unless it says `standalone: false`.
# Keys under `defaults` apply to every blog and book unless overridden.

defaults:
  output_dir: output          # where the .epub files land
  cache_dir: cache            # per-blog download cache (posts + images)
  user_agent: "blog2epub/0.1 (+https://github.com/jaydotsee/blog2epub)"
  request_delay: 0.5          # seconds to wait between HTTP requests
  timeout: 30
  language: en
  images: true                # download and embed images
  max_image_width: 1200       # pick the srcset candidate closest to (but not above) this width
  max_image_bytes: 8000000    # skip images larger than this
  group_by: year              # year | year-month | month | blog | none  -> the "part" level of the navigation
  order: asc                  # asc = oldest post first (reads like a book); desc = newest first (magazine)
  split: none                 # none = one EPUB per book; year = one EPUB per year
  demote_headings: true       # shift headings inside posts down so the post title stays the only h1
  readability: auto           # auto | always | never  (see README)
  excerpts: true              # excerpts on the contents pages
  featured_images: true       # lead each chapter with the post's featured image when it has one

blogs:
  - id: tyk
    title: "Tyk Blog"
    url: https://tyk.io/blog
    author: "Tyk Technologies"
    description: "Every post from the Tyk API management blog, collected as an ebook."
    source: auto              # auto | wordpress | feed | sitemap
    include:
      - "^https://tyk\\.io/blog/"     # only posts whose URL matches one of these regexes
    exclude: []
    # since: "2020-01-01"     # lower bound on publication date; "1y", "3m", "2w", "7d" work too
    cover: covers/tyk.jpg     # rendered by `make cover`; a jpg/png path (relative to this file) or a URL
    order: desc               # newest post first
    group_by: year-month      # contents: year -> month -> posts
    # keep: ["article.post"]  # CSS selectors: the article container(s), Calibre-recipe style
    # remove: [".share", ".newsletter-signup"]   # CSS selectors: clutter to drop from every post
    # extra_css: ".blog-tyk pre { font-size: 0.8em; }"

  # Sources for the API Management Digest. They only need the recent past, so `since: 3m`
  # keeps the first sync small; the cache still accumulates from then on.
  - id: apichangelog
    title: "API Changelog"
    url: https://apichangelog.substack.com
    standalone: false
    since: 3m
  - id: apievangelist
    title: "API Evangelist"
    url: https://apievangelist.com
    standalone: false
    since: 3m
  - id: apiscene
    title: "API Scene"
    url: https://apiscene.io
    standalone: false
    since: 3m
    wordpress:
      params: { author_exclude: 3 }   # apidays' articles are their own source below
  - id: apidays
    title: "APIDAYS"
    url: https://www.apiscene.io/author/apidays-conferences/   # apidays publishes on API Scene
    standalone: false
    since: 3m
    wordpress:
      api: https://www.apiscene.io/wp-json/wp/v2
      params: { author: 3 }
  - id: axway
    title: "Axway Blog"
    url: https://blog.axway.com
    standalone: false
    since: 3m
  - id: brunopedro
    title: "Bruno Pedro"
    url: https://brunopedro.com
    standalone: false
    since: 3m
    include:
      - "^https://brunopedro\\.com/\\d{4}/"     # posts live at /YYYY/MM/DD/slug/; skip the site pages
  - id: gravitee
    title: "Gravitee Blog"
    url: https://www.gravitee.io/blog
    standalone: false
    since: 3m
  - id: kong
    title: "Kong Blog"
    url: https://konghq.com/blog
    author: "Kong Inc."
    description: "Every post from the Kong blog: API gateways, service mesh, AI gateways and platform engineering."
    # The feed carries only the latest ten posts; the sitemap lists the whole archive.
    source: sitemap
    sitemap: { url: https://konghq.com/sitemaps/blogs.xml }
    include:
      - "^https://konghq\\.com/blog/[^/]+/[^/]+"   # posts are /blog/<category>/<slug>; skip the category indexes
    # Kong prerenders twenty related-post cards into every page, so readability alone bleeds
    # text from other articles. Keep the article body and drop the surrounding furniture.
    keep:
      - "[class*='TableOfContents_body']"
    remove:
      - "[class*='Card_card']"
      - "[class*='Article_moreOnThis']"
      - "[class*='Article_cta']"
      - "[class*='TermList_']"
      - "[class*='Breadcrumbs_']"
      - "[class*='Article_authors']"
      - "[class*='Article_meta']"
      - "[class*='Newsletter']"
      - "span.agent"
    order: desc               # newest post first
    group_by: year-month      # contents: year -> month -> posts
    cover: covers/kong.jpg    # rendered by `make cover`
  - id: nordicapis
    title: "Nordic APIs"
    url: https://nordicapis.com/blog
    standalone: false
    since: 3m
  - id: postman
    title: "Postman Blog"
    url: https://blog.postman.com
    standalone: false
    since: 3m

books:
  - id: api-management
    title: "API Management Digest"
    description: "A monthly digest: the last 30 days of posts from the API management blogs that matter."
    author: "Various"
    blogs: [apichangelog, apidays, apievangelist, apiscene, axway, brunopedro, gravitee, kong, nordicapis, postman, tyk]
    since: 1m                 # rolling 30-day window, measured at build time
    group_by: blog            # one part per blog
    order: desc               # newest first
    cover: covers/api-management.jpg   # rendered by `make cover`
