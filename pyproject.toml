[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blog2epub"
version = "0.2.0"
description = "Monitor blogs and turn them into navigable EPUB books and monthly digests for your e-reader"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jaydotsee" }]
keywords = ["epub", "ebook", "blog", "rss", "wordpress", "readability", "e-reader", "kindle", "kobo", "digest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "lxml>=5.0",
    "cssselect>=1.2",
    "lxml_html_clean>=0.4",
    "readability-lxml>=0.8",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-requests", "types-PyYAML", "cairosvg>=2.7"]
covers = ["playwright>=1.45"]
svg = ["cairosvg>=2.7"]

[project.urls]
Homepage = "https://github.com/jaydotsee/blog2epub"
Repository = "https://github.com/jaydotsee/blog2epub"
Issues = "https://github.com/jaydotsee/blog2epub/issues"
Changelog = "https://github.com/jaydotsee/blog2epub/blob/main/CHANGELOG.md"
Releases = "https://github.com/jaydotsee/blog2epub/releases"

[project.scripts]
blog2epub = "blog2epub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blog2epub = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL"]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
