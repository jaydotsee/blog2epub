# Weekly sync, and nothing else: fetch what is new into the download cache so a manual release
# (release.yml) starts warm. GitHub evicts an Actions cache after seven days unused, and without
# this a release after an idle fortnight re-fetches every post and image — an hour for the
# biggest archive instead of minutes. Builds nothing, publishes nothing. Delete the schedule
# block below if you would rather nothing ran unasked.
name: Sync the cache

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every post (ignore the cache)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cache            # never alongside a release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # A unique key per run so the newest cache is always the one saved; restore-keys picks
      # up the previous run's, or a release's.
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: cache
          key: blog2epub-cache-${{ github.run_id }}
          restore-keys: |
            blog2epub-cache-

      - name: Sync every blog
        run: blog2epub -v sync ${{ inputs.full == true && '--full' || '' }} | tee sync.txt

      - name: Summarise
        run: |
          { echo "## Sync"; echo; echo '```'; cat sync.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
