name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip
          echo "EPUBCHECK_JAR=$PWD/epubcheck-5.2.1/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest -q
