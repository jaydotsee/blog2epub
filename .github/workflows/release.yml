# Publish books: every month on the 1st, and whenever you press the button.
#
# Each book becomes an issue, <book>-<YYYYMMDD>, holding its volumes <book>-<YYYYMMDD>.<n>.epub
# with a table of them in the notes, and <book>-latest is moved to the same files so there is
# always one link to the newest Tyk, Kong, ... A re-run of the same issue replaces its files.
# Books are built one after another so each sync lands in the shared download cache that the
# weekly sync.yml keeps warm.
#
# The monthly run takes every book, with the issue dated YYYYMM01, in the standard edition. It
# suits the api-management digest in particular, whose `since: 1m` window means each issue is the
# month just gone.
#
# edition: collectors instead builds each book as one file, ignoring split and max_book_bytes, and
# publishes it to <book>-collectors-<YYYYMMDD> and <book>-collectors-latest. Those files are large
# by design — the whole Axway archive is 291 MB — so they are for keeping, not for Send to Kindle.
# Note that GitHub disables scheduled workflows in a repository with no activity for 60 days;
# a push or a manual run re-enables them.
name: Release books

on:
  schedule:
    - cron: "0 7 1 * *"       # the 1st of every month, 07:00 UTC (an hour after sync.yml's slot)
  workflow_dispatch:
    inputs:
      books:
        description: "Book ids from blogs.yaml, comma-separated, or `all`"
        required: true
        default: "all"
      edition:
        description: "standard = volumes per year; collectors = the whole archive in one file"
        type: choice
        options: [standard, collectors]
        default: standard
      issue:
        description: "Issue date as YYYYMMDD (default: today, UTC). Re-use a date to replace that issue's files."
        required: false
        default: ""
      full:
        description: "Re-fetch every post (ignore the cache)"
        type: boolean
        default: false

env:
  UV_PYTHON: "3.12"

permissions:
  contents: write

concurrency:
  group: release          # never two publishing runs at once; sync.yml may run alongside,
  cancel-in-progress: false   # since this workflow only reads the cache

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.plan.outputs.books }}
      issue: ${{ steps.plan.outputs.issue }}
      suffix: ${{ steps.plan.outputs.suffix }}
      flag: ${{ steps.plan.outputs.flag }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --no-dev
      - name: Which books, which issue
        id: plan
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          from datetime import datetime, timezone
          from blog2epub.config import load_config
          known = [b.id for b in load_config("blogs.yaml").all_books()]
          # The inputs context is empty on a scheduled run, so empty means every book, today.
          asked = "${{ inputs.books }}".strip()
          books = known if asked in ("", "all") else [b.strip() for b in asked.split(",") if b.strip()]
          unknown = [b for b in books if b not in known]
          if unknown:
              sys.exit(f"::error::unknown book(s) {unknown}; configured: {known}")
          issue = "${{ inputs.issue }}".strip() or datetime.now(timezone.utc).strftime("%Y%m%d")
          if not re.fullmatch(r"\d{8}", issue):
              sys.exit(f"::error::issue must be YYYYMMDD, not {issue!r}")
          print(f"books={json.dumps(books)}")
          print(f"issue={issue}")
          # A scheduled run has no inputs, so the empty edition is the standard one.
          collectors = "${{ inputs.edition }}".strip() == "collectors"
          print(f"suffix={'-collectors' if collectors else ''}")
          print(f"flag={'--collectors' if collectors else ''}")
          PY

  release:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # a book that fails does not stop the others
      matrix:
        book: ${{ fromJSON(needs.plan.outputs.books) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev --extra covers --extra svg

      # Each volume's cover is rendered from its template during the build. Best effort: if
      # Chromium cannot be set up, the build falls back to the committed cover image and says so.
      - name: Install Chromium for the covers
        continue-on-error: true
        run: uv run python -m playwright install --with-deps chromium

      # Restore only. Books run in parallel, and if each saved its own copy the lineage would
      # fork: every run would restore whichever job happened to finish last, holding one book's
      # blogs and nothing else. sync.yml is the single writer, so the cache stays whole. What a
      # release fetches on top is at most a week of posts, and next Monday's sync persists it.
      #
      # Because sync.yml is the only writer, a `Cache not found for input keys` here means it has
      # not run yet — on a new checkout, or after a fortnight idle. Not an error: this job then
      # fetches the whole archive itself, slowly. Run `Sync the cache` once to prime it.
      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: blog2epub-cache-${{ github.run_id }}
          restore-keys: |
            blog2epub-cache-

      # --jobs syncs the book's blogs at once, so a throttled source (Apigee takes 1.5s a
      # request) does not gate the other ten in the digest. Blogs sharing a host still queue.
      - name: Sync
        run: uv run blog2epub -v sync "${{ matrix.book }}" --jobs 4 ${{ inputs.full == true && '--full' || '' }}

      - name: Build
        id: build
        run: |
          uv run blog2epub -v build "${{ matrix.book }}" --issue "${{ needs.plan.outputs.issue }}" \
            ${{ needs.plan.outputs.flag }} --report build.json
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("build.json"))
          book = r["books"][0]
          if book.get("error") or not book["built"]:
              raise SystemExit(f"::error::{book.get('error') or 'nothing was built'}")
          print(f"title={book['title']}")
          vols = book["built"]
          lines = [f"{book['title']}, issue {r['issue']}, built by blog2epub.", ""]
          if len(vols) > 1:
              lines.append(f"{sum(v['posts'] for v in vols)} posts in {len(vols)} volumes, each under the size Send to Kindle accepts:")
              lines.append("")
              lines.append("| File | Volume | Posts | Covers | Size |")
              lines.append("| --- | --- | --- | --- | --- |")
              for v in vols:
                  span = f"{v['first_date']} to {v['last_date']}" if v["first_date"] else ""
                  lines.append(f"| `{v['file']}` | {v['label'] or v['title']} | {v['posts']} | {span} | {v['bytes'] / 1e6:.1f} MB |")
          else:
              v = vols[0]
              span = f", {v['first_date']} to {v['last_date']}" if v["first_date"] else ""
              lines.append(f"`{v['file']}`: {v['posts']} posts{span}, {v['bytes'] / 1e6:.1f} MB.")
          lines += ["", "EPUB 3, validated with epubcheck. Copy to your e-reader or send to Kindle."]
          print("body<<EOF"); print("\n".join(lines)); print("EOF")
          PY
          ls -la output/

      # An issue is one set of files, so re-running it replaces them; the rolling tag likewise.
      # Both run after Build, so a failed build never empties a good release.
      - name: Clear the issue's and the rolling release's existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/clear_release_assets.sh "${{ matrix.book }}${{ needs.plan.outputs.suffix }}-${{ needs.plan.outputs.issue }}"
          scripts/clear_release_assets.sh "${{ matrix.book }}${{ needs.plan.outputs.suffix }}-latest"

      - name: Publish the issue
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.book }}${{ needs.plan.outputs.suffix }}-${{ needs.plan.outputs.issue }}
          target_commitish: ${{ github.sha }}
          name: "${{ steps.build.outputs.title }} — Issue ${{ needs.plan.outputs.issue }}"
          body: ${{ steps.build.outputs.body }}
          files: output/${{ matrix.book }}${{ needs.plan.outputs.suffix }}-${{ needs.plan.outputs.issue }}*.epub
          make_latest: false

      # The rolling tag has to move to this commit, or the release page shows the old one.
      - name: Point the rolling tag here
        run: |
          git tag -f "${{ matrix.book }}${{ needs.plan.outputs.suffix }}-latest" "${{ github.sha }}"
          git push -f origin "refs/tags/${{ matrix.book }}${{ needs.plan.outputs.suffix }}-latest"

      - name: Publish as the book's latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.book }}${{ needs.plan.outputs.suffix }}-latest
          target_commitish: ${{ github.sha }}
          name: "${{ steps.build.outputs.title }} — latest (issue ${{ needs.plan.outputs.issue }})"
          body: |
            The newest issue of ${{ steps.build.outputs.title }}, currently ${{ needs.plan.outputs.issue }}.
            Every issue is kept under its own tag, `${{ matrix.book }}${{ needs.plan.outputs.suffix }}-YYYYMMDD`.

            ${{ steps.build.outputs.body }}
          files: output/${{ matrix.book }}${{ needs.plan.outputs.suffix }}-${{ needs.plan.outputs.issue }}*.epub
          make_latest: false
