# Build one book and publish it as a dated GitHub release.
#
# Three ways to run it (all produce the release tag <book>-<YYYY.MM.DD>):
#   git tag tyk-2026.09.05 && git push origin tyk-2026.09.05
#   git push origin main:release/tyk-2026.09.05          (a throwaway branch, for hosts that block tag pushes)
#   Actions tab -> "Release a book" -> Run workflow with the book id
name: Release a book

on:
  push:
    tags:
      - "*-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
    branches:
      - "release/*-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
  workflow_dispatch:
    inputs:
      book:
        description: "Book id from blogs.yaml (e.g. tyk, api-management)"
        required: true
        default: "tyk"
      full:
        description: "Re-fetch every post (ignore the cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor          # share the cache lock with the weekly monitor
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Which book
        id: which
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            name="${GITHUB_REF_NAME#release/}"
            book="${name%-*}"; issue="${name##*-}"
          else
            book="${{ steps.which.outputs.book }}"; issue="$(date -u +%Y.%m.%d)"
          fi
          echo "book=$book" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "Releasing $book as issue $issue"

      - name: Install
        run: pip install -e ".[covers,svg,images]"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: cache
          key: blog2epub-cache-${{ github.run_id }}
          restore-keys: |
            blog2epub-cache-

      - name: Sync
        run: blog2epub -v sync "${{ steps.which.outputs.book }}" ${{ inputs.full == true && '--full' || '' }}

      - name: Render cover
        continue-on-error: true
        run: |
          if [ -f "covers/${{ steps.which.outputs.book }}.html" ]; then
            python -m playwright install --with-deps chromium
            if grep -q "^  - id: ${{ steps.which.outputs.book }}$" blogs.yaml; then target="--blog"; else target="--book"; fi
            python scripts/render_cover.py $target "${{ steps.which.outputs.book }}" --template "covers/${{ steps.which.outputs.book }}.html" --out "covers/${{ steps.which.outputs.book }}.jpg"
          fi

      - name: Build
        id: build
        run: |
          blog2epub -v build "${{ steps.which.outputs.book }}"
          title=$(python -c "import sys; from blog2epub.config import load_config; print(load_config('blogs.yaml').book(sys.argv[1]).title)" "${{ steps.which.outputs.book }}")
          echo "title=$title" >> "$GITHUB_OUTPUT"
          ls -la output/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.which.outputs.book }}-${{ steps.which.outputs.issue }}
          target_commitish: ${{ github.sha }}
          name: "${{ steps.build.outputs.title }} — Issue ${{ steps.which.outputs.issue }}"
          body: |
            ${{ steps.build.outputs.title }}, built ${{ steps.which.outputs.issue }} by blog2epub.

            EPUB 3, validated with epubcheck. Copy to your e-reader or send to Kindle.
          files: output/${{ steps.which.outputs.book }}*.epub
          make_latest: false
