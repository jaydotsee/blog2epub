# Publish books: every month on the 1st, and whenever you press the button.
#
# One run makes one release. Its tag is the date the files were built - `v2026.09.17` - and every
# book of that issue lands there: <book>-<YYYYMMDD>.<n>.epub for each, with a table of the volumes
# per book in the notes. The newest issue is the repository's latest release, so
# https://github.com/<owner>/<repo>/releases/latest is the standing link; there are no rolling
# per-book tags. A re-run with the same issue date replaces that book's files in the same release
# and leaves the other books' alone.
#
# The monthly run takes every book, with the issue dated YYYYMM01, in the standard edition. It
# suits the api-management digest in particular, whose `since: 1m` window means each issue is the
# month just gone.
#
# edition: collectors instead builds each book as one file, ignoring split and max_book_bytes,
# and publishes to `v<date>-collectors`, kept apart from the standard issue because those files
# are large by design - the whole Axway archive is 291 MB - so they are for keeping, not for Send
# to Kindle. A collector's run never becomes the repository's latest release.
#
# Note that GitHub disables scheduled workflows in a repository with no activity for 60 days;
# a push or a manual run re-enables them.
name: Release books

on:
  schedule:
    - cron: "0 7 1 * *"       # the 1st of every month, 07:00 UTC (an hour after sync.yml's slot)
  workflow_dispatch:
    inputs:
      books:
        description: "Book ids from blogs.yaml, comma-separated, or `all`"
        required: true
        default: "all"
      edition:
        description: "standard = volumes per year; collectors = the whole archive in one file"
        type: choice
        options: [standard, collectors]
        default: standard
      issue:
        description: "Issue date as YYYYMMDD (default: today, UTC). Re-use a date to replace that issue's files."
        required: false
        default: ""
      full:
        description: "Re-fetch every post (ignore the cache)"
        type: boolean
        default: false

env:
  UV_PYTHON: "3.12"

permissions:
  contents: write

concurrency:
  group: release          # never two publishing runs at once; sync.yml may run alongside,
  cancel-in-progress: false   # since this workflow only reads the cache

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.plan.outputs.books }}
      issue: ${{ steps.plan.outputs.issue }}
      tag: ${{ steps.plan.outputs.tag }}
      suffix: ${{ steps.plan.outputs.suffix }}
      flag: ${{ steps.plan.outputs.flag }}
      title: ${{ steps.plan.outputs.title }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --no-dev
      - name: Which books, which issue
        id: plan
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          from datetime import datetime, timezone
          from blog2epub.config import load_config
          known = [b.id for b in load_config("blogs.yaml").all_books()]
          # The inputs context is empty on a scheduled run, so empty means every book, today.
          asked = "${{ inputs.books }}".strip()
          books = known if asked in ("", "all") else [b.strip() for b in asked.split(",") if b.strip()]
          unknown = [b for b in books if b not in known]
          if unknown:
              sys.exit(f"::error::unknown book(s) {unknown}; configured: {known}")
          issue = "${{ inputs.issue }}".strip() or datetime.now(timezone.utc).strftime("%Y%m%d")
          if not re.fullmatch(r"\d{8}", issue):
              sys.exit(f"::error::issue must be YYYYMMDD, not {issue!r}")
          print(f"books={json.dumps(books)}")
          print(f"issue={issue}")
          # A scheduled run has no inputs, so the empty edition is the standard one.
          collectors = "${{ inputs.edition }}".strip() == "collectors"
          print(f"suffix={'-collectors' if collectors else ''}")
          print(f"flag={'--collectors' if collectors else ''}")
          # One tag for the whole run, the date the files were built. Zero-padded fields sort
          # as dates do, which is how `publish` decides whether this issue is the newest.
          tag = f"v{issue[:4]}.{issue[4:6]}.{issue[6:]}" + ("-collectors" if collectors else "")
          print(f"tag={tag}")
          print(f"title={'Collector’s editions' if collectors else 'Books'} — issue {issue}")
          PY

  # The release is opened as a draft before any book uploads to it, so the matrix jobs never race
  # to create the same tag and half an issue is never on show. `publish` takes the draft off.
  open:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Open the issue's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; this run replaces the files of the books it builds."
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "Building ${{ needs.plan.outputs.issue }}…"
          fi

  release:
    needs: [plan, open]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # a book that fails does not stop the others
      matrix:
        book: ${{ fromJSON(needs.plan.outputs.books) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev --extra covers --extra svg

      # Each volume's cover is rendered from its template during the build. Best effort: if
      # Chromium cannot be set up, the build falls back to the committed cover image and says so.
      - name: Install Chromium for the covers
        continue-on-error: true
        run: uv run python -m playwright install --with-deps chromium

      # Restore only. Books run in parallel, and if each saved its own copy the lineage would
      # fork: every run would restore whichever job happened to finish last, holding one book's
      # blogs and nothing else. sync.yml is the single writer, so the cache stays whole. What a
      # release fetches on top is at most a week of posts, and next Monday's sync persists it.
      #
      # Because sync.yml is the only writer, a `Cache not found for input keys` here means it has
      # not run yet — on a new checkout, or after a fortnight idle. Not an error: this job then
      # fetches the whole archive itself, slowly. Run `Sync the cache` once to prime it.
      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: blog2epub-cache-${{ github.run_id }}
          restore-keys: |
            blog2epub-cache-

      # --jobs syncs the book's blogs at once, so a throttled source (Apigee takes 1.5s a
      # request) does not gate the other twelve in the digest. Blogs sharing a host still queue.
      #
      # Exit 2 means one blog failed and the rest synced, which is the whole point of isolating
      # them - so build anyway, from the cache, rather than losing the release. The digest draws
      # on thirteen sites and the first run to publish anything died here because Substack was
      # briefly unreachable at 04:26, with the other twelve fully cached and a perfectly good
      # issue never built. The warning is loud, and a stale source shows up in the volume table
      # as posts that stop early. Anything else (1: a bad config) is still fatal.
      - name: Sync
        run: |
          set +e
          uv run blog2epub -v sync "${{ matrix.book }}" --jobs 4 ${{ inputs.full == true && '--full' || '' }}
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=A source failed::Building ${{ matrix.book }} from the cache without it; see the log above for which."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Build
        run: |
          uv run blog2epub -v build "${{ matrix.book }}" --issue "${{ needs.plan.outputs.issue }}" \
            ${{ needs.plan.outputs.flag }} --report "report-${{ matrix.book }}.json"
          uv run python - <<'PY'
          import json, os
          r = json.load(open(f"report-{os.environ['BOOK']}.json"))
          book = r["books"][0]
          if book.get("error") or not book["built"]:
              raise SystemExit(f"::error::{book.get('error') or 'nothing was built'}")
          PY
          ls -la output/
        env:
          BOOK: ${{ matrix.book }}

      # The notes are written once, by `publish`, from every book's report.
      - name: Keep the build report for the notes
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.book }}
          path: report-${{ matrix.book }}.json
          retention-days: 7

      # This book's files only: the release holds the whole issue, so clearing everything would
      # drop the books that finished first. Runs after Build, so a failed build never empties a
      # good release. --clobber then replaces same-named files if anything slipped through.
      - name: Put this book in the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREFIX: ${{ matrix.book }}${{ needs.plan.outputs.suffix }}-${{ needs.plan.outputs.issue }}
        run: |
          scripts/clear_release_assets.sh "$TAG" "$PREFIX"
          gh release upload "$TAG" output/"$PREFIX"*.epub --clobber

  # Every book is in, so write the notes and take the draft off. `always()` because a book that
  # failed must not cost the issue the books that built.
  publish:
    needs: [plan, open, release]
    if: always() && needs.open.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # continue-on-error because the action fails when the pattern matches nothing, which is
      # what "every book failed" looks like; the step below says so in those words.
      - name: Collect the build reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - name: Publish the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          ISSUE: ${{ needs.plan.outputs.issue }}
          BOOKS: ${{ join(fromJSON(needs.plan.outputs.books), ',') }}
          COLLECTORS: ${{ needs.plan.outputs.flag }}
        run: |
          shopt -s nullglob
          reports=(reports/*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error title=Nothing to publish::No book built; the draft release at $TAG is left as it was."
            exit 1
          fi

          # The notes describe the release, not just this run: a run that rebuilds one book must
          # not drop the sections of the books already published under this issue. A draft has no
          # git tag, so the release is found by listing rather than by tag.
          id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          gh api "repos/$GH_REPO/releases/$id/assets" --paginate \
            --jq '.[] | {name: .name, size: .size}' > assets.jsonl

          python3 scripts/release_notes.py "${reports[@]}" \
            --issue "$ISSUE" --asked "$BOOKS" --assets assets.jsonl ${COLLECTORS:+--collectors} > notes.md
          cat notes.md

          # The newest standard issue is the repository's latest release, so /releases/latest is
          # the standing link. Re-running an older issue must not drag that pointer backwards,
          # and a collector's run never holds it. Tags are v<YYYY.MM.DD>, so a plain sort orders
          # them by date; drafts are excluded, which includes this one until the edit below.
          latest=false
          if [ -z "$COLLECTORS" ]; then
            newest=$(gh api "repos/$GH_REPO/releases" --paginate \
              --jq '.[] | select(.draft == false) | .tag_name' |
              grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | sort -r | head -1 || true)
            if [ -z "$newest" ] || [ "$TAG" = "$(printf '%s\n%s\n' "$TAG" "$newest" | sort -r | head -1)" ]; then
              latest=true
            fi
          fi
          gh release edit "$TAG" --draft=false --title "$TITLE" --notes-file notes.md --latest="$latest"
          gh release view "$TAG" --json url --jq .url
